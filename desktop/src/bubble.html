<!doctype html><meta charset=utf-8><style>html,body{margin:0;background:transparent;overflow:hidden}#b{width:54px;height:54px;margin:3px;border-radius:50%;background:linear-gradient(135deg,#ff8c1a,#d4af37);display:flex;align-items:center;justify-content:center;font-size:26px;-webkit-app-region:drag;box-shadow:0 3px 10px #0007}#t{-webkit-app-region:no-drag;cursor:pointer}</style>
<div id=b title="রয়েল নোটবুক — ক্লিক: খুলুন · ডান-ক্লিক: থামান/চালু"><span id=t>📒</span></div>
<script>const t=document.getElementById('t');t.onclick=()=>window.rbt?.bubble?.('open');t.oncontextmenu=e=>{e.preventDefault();window.rbt?.bubble?.('pause')};window.rbt?.onPaused?.(p=>t.textContent=p?'⏸':'📒')</script>

name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-render.txt }
      - name: Install
        run: pip install -q -r requirements-render.txt pyflakes
      - name: Compile + lint (undefined names / syntax)
        run: |
          python -m py_compile *.py
          pyflakes *.py | grep -E "undefined name|syntax|invalid" && exit 1 || true
          for f in static/*.js; do node --check "$f"; done
      - name: Workspace migration and authorization tests
        run: python -m unittest discover -s tests -p 'test_workspace*.py' -v
      - name: Boot app and hit /bb/health
        run: |
          ln -s "$GITHUB_WORKSPACE" ~/bangla_bhai
          mkdir -p ~/.secrets && cd ~/.secrets
          printf 'BB_USER=ci\nBB_PASSWORD=ci-%s\nBB_SESSION_SECRET=%s\nBB_EDGE_SECRET=\n' "$RANDOM" "$(openssl rand -hex 16)" > bangla_bhai.env; for f in groq gemini openrouter bbai vapid telegram; do touch $f.env; done
          python -c "from cryptography.fernet import Fernet;open('bb_byok.key','wb').write(Fernet.generate_key())"
          cd ~/bangla_bhai && rm -f data.db
          BB_INSECURE_COOKIE=1 uvicorn app:app --port 8099 > /tmp/app.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS localhost:8099/bb/health && ok=1 && break; sleep 1; done
          [ -n "${ok:-}" ] || { cat /tmp/app.log; exit 1; }
          for p in / /login /admin /privacy; do c=$(curl -s -o /dev/null -w '%{http_code}' localhost:8099$p); echo "$p $c"; [ "$c" -lt 500 ] || { tail -50 /tmp/app.log; exit 1; }; done
          c=$(curl -s -o /dev/null -w '%{http_code}' localhost:8099/api/v1/workspaces); echo "/api/v1/workspaces unauthenticated $c"; [ "$c" = "401" ]
